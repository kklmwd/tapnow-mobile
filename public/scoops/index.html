<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#bfe3f5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!--page-->
<title>Scoops</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" />
<style>
  /* One full-screen canvas; the whole UI is drawn in it. A single pastel look, no theme switch. */
  :root {
    --sky: #bfe3f5;
    --ink: #3b2a4a;
    --display: 'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Nunito', 'Avenir Next', system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sky);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="game" aria-label="Scoops: hold and slide to move the cone and catch falling ice cream scoops"></canvas>
<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DISPLAY = "'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif";
  const BODY = "'Nunito', 'Avenir Next', system-ui, sans-serif";
  const INK = '#3b2a4a';

  const FLAVORS = [
    { name: 'strawberry', c: '#f7a8b8', d: '#e48aa0' },
    { name: 'mint', c: '#a6e3c8', d: '#7fcaa8' },
    { name: 'vanilla', c: '#fff4dc', d: '#ecd7ad' },
    { name: 'chocolate', c: '#8a5a44', d: '#6c4332' },
    { name: 'blueberry', c: '#b9a8f0', d: '#9784dc' },
    { name: 'mango', c: '#ffcf7a', d: '#f0b155' },
  ];
  const SPRINKLES = ['#ff6f91', '#ffd166', '#5ec2f2', '#7bd389', '#ffffff'];
  // The sky drifts through these as the tower climbs, then loops.
  const SKIES = [
    ['#bfe3f5', '#e6f5fc'],
    ['#d4cdf5', '#f1eefd'],
    ['#f6d2e0', '#fdeef4'],
    ['#ffdcc4', '#fff3e8'],
    ['#f7ecb5', '#fdf9e4'],
    ['#c9efd9', '#edfbf3'],
  ];

  let W = 0, H = 0, DPR = 1, R = 30, STEP = 38, BASE = 0;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = cvs.clientWidth;
    H = cvs.clientHeight;
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    R = clamp(Math.min(W, H * 0.62) * 0.085, 22, 42);
    STEP = R * 1.22;
    BASE = H - Math.max(R * 3.4, H * 0.2);
    cone.x = clamp(cone.x || W / 2, R, W - R);
    cone.tx = cone.x;
  }

  let best = 0;
  try { best = +localStorage.getItem('scoops-best') || 0; } catch (e) {}
  const saveBest = () => { try { localStorage.setItem('scoops-best', String(best)); } catch (e) {} };

  const cone = { x: 0, tx: 0, px: 0, lean: 0, leanV: 0 };
  let state = 'title';
  let stack, falling, bits, pops, score, lives, combo, spawnT, cam, stateT, shake, played = 0;

  function reset() {
    stack = [];
    falling = [];
    bits = [];
    pops = [];
    score = 0;
    lives = 3;
    combo = 0;
    spawnT = 0.5;
    cam = 0;
    stateT = 0;
    shake = 0;
    cone.lean = cone.leanV = 0;
  }
  reset();
  resize();
  window.addEventListener('resize', resize);

  // ---------- geometry ----------
  const scoopWorldY = (i) => i * STEP + R * 0.55;
  const toScreenY = (wy) => BASE - wy + cam;
  const topCx = () => (stack.length ? stack[stack.length - 1].cx : 0);
  // Upper scoops sway more than lower ones; the cone itself stays rigid.
  const sway = (i) => {
    const d = stack.length - 1 - i;
    const f = Math.max(0, 1 - d / 9);
    return cone.lean * f * f * Math.min(1, stack.length / 8);
  };
  const scoopX = (i) => cone.x + stack[i].cx + sway(i);
  const landX = () => (stack.length ? scoopX(stack.length - 1) : cone.x);
  const landY = () => toScreenY(scoopWorldY(stack.length));

  // ---------- sound ----------
  let audio = null;
  function tone(freq, dur, type = 'sine', vol = 0.06, slide = 0) {
    if (!audio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const PENTA = [0, 2, 4, 7, 9];
  const note = (n) => 392 * Math.pow(2, (PENTA[n % 5] + 12 * Math.floor(n / 5)) / 12);
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ---------- input: one finger, hold and slide ----------
  let holding = false, holdX = 0, holdCone = 0;
  cvs.addEventListener('pointerdown', (e) => {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {}
    }
    if (audio && audio.state === 'suspended') audio.resume();
    if (state === 'title') { state = 'play'; stateT = 0; }
    else if (state === 'over') {
      if (stateT < 0.7) return;
      reset();
      state = 'play';
    }
    holding = true;
    holdX = e.clientX;
    holdCone = cone.tx;
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cvs.addEventListener('pointermove', (e) => {
    if (!holding) return;
    // Relative drag, so the finger never has to cover the tower.
    const c = topCx();
    cone.tx = clamp(holdCone + (e.clientX - holdX) * 1.2, R - c, W - R - c);
  });
  const release = () => { holding = false; };
  cvs.addEventListener('pointerup', release);
  cvs.addEventListener('pointercancel', release);
  cvs.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- game ----------
  function spawn() {
    const cherry = lives < 3 && score > 4 && Math.random() < 0.09;
    const speedK = 0.27 + Math.min(score, 140) * 0.0036;
    falling.push({
      kind: cherry ? 'cherry' : 'scoop',
      f: FLAVORS[(Math.random() * FLAVORS.length) | 0],
      spr: Math.random() < 0.3,
      seed: Math.random() * 1000,
      x: rand(R * 1.2, W - R * 1.2),
      y: -R * 1.5,
      vy: H * speedK * rand(0.9, 1.1),
      wob: rand(0, Math.PI * 2),
      passed: false,
    });
  }

  function burst(x, y, color, n, power) {
    for (let k = 0; k < n; k++) {
      const a = rand(0, Math.PI * 2), s = rand(0.3, 1) * power;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - power * 0.4, r: rand(2, 4.5), c: color, life: rand(0.5, 0.9) });
    }
  }

  function pop(text, x, y, big) {
    pops.push({ text, x, y, t: 0, big });
  }

  function catchIt(f, dx) {
    if (f.kind === 'cherry') {
      lives = Math.min(3, lives + 1);
      burst(f.x, landY(), '#e5383b', 14, 220);
      pop('+1 cone', f.x, landY() - R, false);
      tone(880, 0.12, 'triangle', 0.05);
      tone(1320, 0.18, 'triangle', 0.04);
      return;
    }
    const perfect = Math.abs(dx) < R * 0.2;
    combo = perfect ? combo + 1 : 0;
    const prev = topCx();
    stack.push({ cx: prev + (perfect ? 0 : dx * 0.85), f: f.f, spr: f.spr, seed: f.seed, sq: 0.62 });
    score += 1 + (perfect ? Math.min(combo - 1, 4) : 0);
    const y = toScreenY(scoopWorldY(stack.length - 1));
    burst(scoopX(stack.length - 1), y + R * 0.4, f.f.c, perfect ? 12 : 6, perfect ? 240 : 140);
    if (perfect) pop(combo > 1 ? 'perfect ×' + combo : 'perfect', scoopX(stack.length - 1), y - R * 1.4, combo > 1);
    tone(note(Math.min(combo + (stack.length % 5), 14)), 0.14, 'sine', 0.07);
    if (perfect) tone(note(combo + 7), 0.16, 'triangle', 0.035);
    // Kick the tower a little in the direction of an off-centre landing.
    cone.leanV += dx * 6;
    buzz(perfect ? 18 : 8);
  }

  function miss(f) {
    if (f.kind === 'cherry') return;
    lives--;
    combo = 0;
    shake = reduceMotion ? 0 : 10;
    burst(f.x, H - 6, f.f.c, 16, 260);
    tone(180, 0.28, 'sine', 0.08, 0.45);
    buzz(40);
    if (lives <= 0) gameOver();
  }

  function gameOver() {
    state = 'over';
    stateT = 0;
    holding = false;
    played++;
    if (score > best) { best = score; saveBest(); }
    // The visible part of the tower topples.
    const dir = cone.lean >= 0 ? 1 : -1;
    for (let i = Math.max(0, stack.length - 16); i < stack.length; i++) {
      const y = toScreenY(scoopWorldY(i));
      if (y < -R * 2 || y > H + R * 2) continue;
      const h = (i - (stack.length - 16)) / 16;
      bits.push({ scoop: stack[i], x: scoopX(i), y, vx: dir * rand(40, 140) * (0.5 + h) + rand(-60, 60), vy: rand(-260, -60), rot: 0, vr: rand(-4, 4), life: 3 });
    }
    stack = [];
    falling = [];
    tone(330, 0.35, 'triangle', 0.06, 0.5);
  }

  function update(dt) {
    stateT += dt;
    shake *= Math.pow(0.002, dt);

    // Cone follows the finger with a little smoothing.
    cone.px = cone.x;
    if (state === 'title') cone.tx = W / 2 + Math.sin(stateT * 1.6) * W * 0.18;
    const c = topCx();
    cone.tx = clamp(cone.tx, R - c, W - R - c);
    cone.x += (cone.tx - cone.x) * (1 - Math.exp(-dt * 26));
    const vel = (cone.x - cone.px) / Math.max(dt, 1e-3);
    const target = clamp(-vel * 0.05, -R * 1.3, R * 1.3);
    cone.leanV += ((target - cone.lean) * 110 - cone.leanV * 10) * dt;
    cone.lean += cone.leanV * dt;

    for (const s of stack) if (s.sq < 1) s.sq = Math.min(1, s.sq + (1 - s.sq) * dt * 12 + dt * 0.4);

    // Camera keeps the landing spot around the middle of the screen.
    const want = Math.max(0, scoopWorldY(stack.length) - (BASE - H * 0.52));
    cam += (want - cam) * (1 - Math.exp(-dt * 5));

    if (state === 'play') {
      spawnT -= dt;
      const maxAir = 1 + Math.min(2, Math.floor(score / 18));
      if (spawnT <= 0 && falling.length < maxAir) {
        spawn();
        spawnT = Math.max(0.42, 1.45 - score * 0.016) * rand(0.85, 1.2);
      }
      for (let k = falling.length - 1; k >= 0; k--) {
        const f = falling[k];
        const ly = landY();
        const before = f.y;
        f.y += f.vy * dt;
        f.wob += dt * 3;
        if (!f.passed && before < ly && f.y >= ly) {
          const dx = f.x - landX();
          if (Math.abs(dx) < (f.kind === 'cherry' ? R * 1.2 : R * 1.05)) {
            catchIt(f, dx);
            falling.splice(k, 1);
            continue;
          }
          f.passed = true;
        }
        if (f.y > H + R * 2) {
          falling.splice(k, 1);
          if (state === 'play') miss(f);
        }
      }
    }

    for (let k = bits.length - 1; k >= 0; k--) {
      const b = bits[k];
      b.vy += 900 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.scoop) b.rot += b.vr * dt;
      if (b.life <= 0 || b.y > H + R * 3) bits.splice(k, 1);
    }
    for (let k = pops.length - 1; k >= 0; k--) {
      pops[k].t += dt;
      if (pops[k].t > 0.9) pops.splice(k, 1);
    }
  }

  // ---------- drawing ----------
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (p, s) => (p >> s) & 255;
    const m = (s) => Math.round(ch(pa, s) + (ch(pb, s) - ch(pa, s)) * t);
    return `rgb(${m(16)},${m(8)},${m(0)})`;
  }

  function sky() {
    const p = (cam / (H * 5)) % SKIES.length;
    const i = Math.floor(p), t = p - i;
    const a = SKIES[i], b = SKIES[(i + 1) % SKIES.length];
    const s = t * t * (3 - 2 * t);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, mix(a[0], b[0], s));
    g.addColorStop(1, mix(a[1], b[1], s));
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    // Soft dots drifting past as the camera climbs.
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    for (let k = 0; k < 16; k++) {
      const hx = Math.sin(k * 12.9898) * 43758.5453, hy = Math.sin(k * 78.233) * 12543.123;
      const x = (hx - Math.floor(hx)) * W;
      const span = H + 80;
      const y = (((hy - Math.floor(hy)) * span + cam * (0.25 + (k % 3) * 0.12)) % span) - 40;
      ctx.beginPath();
      ctx.arc(x, y, 2 + (k % 4) * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawScoop(x, y, r, s, sq = 1, rot = 0) {
    const f = s.f;
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.scale(2 - sq, sq);
    // Drippy skirt.
    ctx.fillStyle = f.d;
    ctx.beginPath();
    ctx.ellipse(0, r * 0.38, r * 1.0, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.arc(k * r * 0.4, r * 0.62 + (k % 2 ? r * 0.06 : 0), r * 0.24, 0, Math.PI * 2);
      ctx.fill();
    }
    // Body.
    ctx.fillStyle = f.c;
    ctx.beginPath();
    ctx.arc(0, -r * 0.05, r * 0.92, 0, Math.PI * 2);
    ctx.fill();
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.arc(k * r * 0.4, r * 0.48 + (k % 2 ? 0 : r * 0.04), r * 0.27, 0, Math.PI * 2);
      ctx.fill();
    }
    // Sprinkles.
    if (s.spr) {
      for (let k = 0; k < 6; k++) {
        const a = s.seed + k * 2.4;
        const px = Math.cos(a) * r * 0.55, py = Math.sin(a * 1.3) * r * 0.45 - r * 0.15;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a * 3);
        ctx.fillStyle = SPRINKLES[k % SPRINKLES.length];
        ctx.fillRect(-r * 0.11, -r * 0.035, r * 0.22, r * 0.07);
        ctx.restore();
      }
    }
    // Shine.
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.36, -r * 0.42, r * 0.22, r * 0.13, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawCherry(x, y, r) {
    ctx.strokeStyle = '#5b8c3a';
    ctx.lineWidth = Math.max(2, r * 0.09);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.35);
    ctx.quadraticCurveTo(x + r * 0.1, y - r * 0.9, x + r * 0.45, y - r * 1.05);
    ctx.stroke();
    ctx.fillStyle = '#e5383b';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(x - r * 0.16, y - r * 0.14, r * 0.1, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCone(x, rimY) {
    const w = R * 1.0, h = R * 2.7;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - w, rimY);
    ctx.lineTo(x + w, rimY);
    ctx.lineTo(x + R * 0.08, rimY + h);
    ctx.quadraticCurveTo(x, rimY + h + R * 0.08, x - R * 0.08, rimY + h);
    ctx.closePath();
    ctx.fillStyle = '#eab676';
    ctx.fill();
    ctx.clip();
    ctx.strokeStyle = '#cf9450';
    ctx.lineWidth = Math.max(1.5, R * 0.06);
    for (let k = -6; k <= 6; k++) {
      const o = k * R * 0.42;
      ctx.beginPath();
      ctx.moveTo(x + o - h, rimY - 2);
      ctx.lineTo(x + o + h, rimY + h * 2);
      ctx.moveTo(x + o + h, rimY - 2);
      ctx.lineTo(x + o - h, rimY + h * 2);
      ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#d99a52';
    const rh = R * 0.34;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x - w * 1.08, rimY - rh * 0.6, w * 2.16, rh, rh / 2) : ctx.rect(x - w * 1.08, rimY - rh * 0.6, w * 2.16, rh);
    ctx.fill();
  }

  function text(str, x, y, size, font, color, alpha = 1, weight = '') {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.font = `${weight} ${size}px ${font}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
    ctx.translate(sx, sy);
    sky();

    const rimY = toScreenY(0);
    if (rimY < H + R * 3) drawCone(cone.x, rimY);

    // Only the visible slice of an endless tower is drawn.
    const i0 = Math.max(0, Math.floor((BASE + cam - H - R * 3) / STEP));
    for (let i = i0; i < stack.length; i++) {
      const y = toScreenY(scoopWorldY(i));
      if (y < -R * 2) break;
      drawScoop(scoopX(i), y, R, stack[i], stack[i].sq);
    }

    // Faint guide where the next scoop lands.
    if (state === 'play') {
      ctx.strokeStyle = 'rgba(59,42,74,0.12)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      const lx = landX(), ly = landY() - R * 0.2;
      ctx.ellipse(lx, ly, R * 1.0, R * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (const f of falling) {
      const x = f.x + Math.sin(f.wob) * 1.5;
      if (f.kind === 'cherry') drawCherry(x, f.y, R);
      else drawScoop(x, f.y, R, f, 1, Math.sin(f.wob) * 0.05);
    }

    for (const b of bits) {
      if (b.scoop) drawScoop(b.x, b.y, R, b.scoop, 1, b.rot);
      else {
        ctx.globalAlpha = clamp(b.life / 0.5, 0, 1);
        ctx.fillStyle = b.c;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    for (const p of pops) {
      const a = 1 - p.t / 0.9;
      text(p.text, p.x, p.y - p.t * 40, p.big ? R * 0.62 : R * 0.5, BODY, INK, a, '800');
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const top = Math.max(18, H * 0.06);

    if (state === 'play') {
      text(String(score), W / 2, top + R * 0.9, R * 1.9, DISPLAY, INK, 0.9);
      // Lives: three little cones.
      for (let k = 0; k < 3; k++) {
        const x = W / 2 + (k - 1) * R * 0.7, y = top + R * 2.1;
        ctx.globalAlpha = k < lives ? 0.85 : 0.18;
        ctx.fillStyle = k < lives ? '#d99a52' : INK;
        ctx.beginPath();
        ctx.moveTo(x - R * 0.2, y - R * 0.12);
        ctx.lineTo(x + R * 0.2, y - R * 0.12);
        ctx.lineTo(x, y + R * 0.32);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = k < lives ? '#f7a8b8' : INK;
        ctx.beginPath();
        ctx.arc(x, y - R * 0.2, R * 0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    } else if (state === 'title') {
      const bob = reduceMotion ? 0 : Math.sin(stateT * 2) * 4;
      text('scoops', W / 2, H * 0.27 + bob, Math.min(W * 0.2, R * 3), DISPLAY, INK, 0.92);
      text('hold & slide to catch', W / 2, H * 0.27 + R * 1.9, R * 0.52, BODY, INK, 0.7, '800');
      if (best) text('best ' + best, W / 2, H * 0.27 + R * 2.8, R * 0.45, BODY, INK, 0.5, '600');
    } else if (state === 'over') {
      const a = clamp(stateT * 2.5, 0, 1);
      text('melted', W / 2, H * 0.24, R * 0.62, BODY, INK, 0.6 * a, '800');
      text(String(score), W / 2, H * 0.24 + R * 1.8, R * 3, DISPLAY, INK, 0.92 * a);
      text(score >= best && score > 0 ? 'new best' : 'best ' + best, W / 2, H * 0.24 + R * 3.6, R * 0.5, BODY, INK, 0.6 * a, '800');
      if (stateT > 0.7) {
        const pulse = reduceMotion ? 0.7 : 0.55 + Math.sin(stateT * 4) * 0.2;
        text('tap to scoop again', W / 2, H * 0.24 + R * 4.6, R * 0.48, BODY, INK, pulse, '800');
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`40px ${DISPLAY}`).catch(() => {});
    document.fonts.load(`800 20px ${BODY}`).catch(() => {});
  }
})();
</script>
</body>
</html>
