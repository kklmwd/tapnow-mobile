<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ff2e93" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!--page-->
<title>Scoops</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito:wght@600;800&display=swap" />
<style>
  /* One full-screen canvas; the whole UI is drawn in it. A single loud arcade look, no theme switch. */
  :root {
    --sky: #ff2e93;
    --ink: #111111;
    --display: 'Dela Gothic One', 'Arial Black', system-ui, sans-serif;
    --body: 'Nunito', 'Avenir Next', system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sky);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="game" aria-label="Scoops: hold and slide to move the cone and catch falling ice cream scoops"></canvas>
<script>
(() => {
  const cvs = document.getElementById('game');
  // Reassigned briefly while painting cached sprites.
  let ctx = cvs.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const BODY = "'Nunito', 'Avenir Next', system-ui, sans-serif";
  const POP = "'Dela Gothic One', 'Arial Black', system-ui, sans-serif";
  const BLACK = '#111111';
  const INK = '#3b2a4a';

  const FLAVORS = [
    { name: 'strawberry', c: '#f7a8b8', d: '#e48aa0' },
    { name: 'mint', c: '#a6e3c8', d: '#7fcaa8' },
    { name: 'vanilla', c: '#fff4dc', d: '#ecd7ad' },
    { name: 'chocolate', c: '#8a5a44', d: '#6c4332' },
    { name: 'blueberry', c: '#b9a8f0', d: '#9784dc' },
    { name: 'mango', c: '#ffcf7a', d: '#f0b155' },
  ];
  const SPRINKLES = ['#ff6f91', '#ffd166', '#5ec2f2', '#7bd389', '#ffffff'];
  const CONFETTI = ['#ffd000', '#00b7ff', '#ff2e93', '#14cc6a', '#8f2bff', '#ff7a00', '#ffffff'];
  // The sky drifts through these as the tower climbs, then loops.
  const SKIES = [
    ['#ff2e93', '#ff7cc2'],
    ['#ff7a00', '#ffb64d'],
    ['#00a8f0', '#66d9ff'],
    ['#8f2bff', '#c38bff'],
    ['#ffc400', '#ffe766'],
    ['#10c463', '#6cf0a6'],
  ];
  const COMBO_WORDS = ['PERFECT!', 'DOUBLE!', 'TRIPLE!', 'ON FIRE!', 'BRAIN FREEZE!', 'SCOOPTACULAR!', 'UNSTOPPABLE!', 'LEGENDARY!'];
  const SMALL_WORDS = ['plop', 'yum', 'nice', 'boop', 'mmm', 'tasty', 'yes!'];

  let W = 0, H = 0, DPR = 1, R = 30, STEP = 38, BASE = 0;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = cvs.clientWidth;
    H = cvs.clientHeight;
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    R = clamp(Math.min(W, H * 0.62) * 0.085, 22, 42);
    STEP = R * 1.22;
    BASE = H - Math.max(R * 3.4, H * 0.2);
    cone.x = clamp(cone.x || W / 2, R, W - R);
    cone.tx = cone.x;
    sprites.clear();
    halftone = makeHalftone();
  }
  const sprites = new Map();
  let halftone = null;

  let best = 0, muted = false;
  try {
    best = +localStorage.getItem('scoops-best') || 0;
    muted = localStorage.getItem('scoops-muted') === '1';
  } catch (e) {}
  const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  const cone = { x: 0, tx: 0, px: 0, lean: 0, leanV: 0 };
  let state = 'title';
  let stack, falling, bits, pops, rings, score, lives, combo, spawnT, cam, stateT;
  let shake = 0, flashA = 0, flashC = '#fff', freeze = 0, beat = 0, scorePulse = 0, time = 0;

  function reset() {
    stack = [];
    falling = [];
    bits = [];
    pops = [];
    rings = [];
    score = 0;
    lives = 3;
    combo = 0;
    spawnT = 0.5;
    cam = 0;
    stateT = 0;
    shake = 0;
    cone.lean = cone.leanV = 0;
  }
  reset();
  resize();
  window.addEventListener('resize', resize);

  // Speed tier from the tower height: flat for the first 10 scoops, then one
  // step every 5 scoops, and from 20 scoops one step every 3.
  function tier(n) {
    if (n < 10) return 0;
    if (n < 20) return 1 + Math.floor((n - 10) / 5);
    return 3 + Math.floor((n - 20) / 3);
  }

  // ---------- geometry ----------
  const scoopWorldY = (i) => i * STEP + R * 0.55;
  const toScreenY = (wy) => BASE - wy + cam;
  const topCx = () => (stack.length ? stack[stack.length - 1].cx : 0);
  // Upper scoops sway more than lower ones; the cone itself stays rigid.
  const sway = (i) => {
    const d = stack.length - 1 - i;
    const f = Math.max(0, 1 - d / 9);
    return cone.lean * f * f * Math.min(1, stack.length / 8);
  };
  const scoopX = (i) => cone.x + stack[i].cx + sway(i);
  const landX = () => (stack.length ? scoopX(stack.length - 1) : cone.x);
  const landY = () => toScreenY(scoopWorldY(stack.length));

  // ---------- sound ----------
  let audio = null, master = null, noiseBuf = null;
  function initAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const comp = audio.createDynamicsCompressor();
    master = audio.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(comp).connect(audio.destination);
    noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const now = () => (audio ? audio.currentTime : 0);
  function env(g, t, vol, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function tone(freq, dur, type = 'sine', vol = 0.06, slide = 1, at = 0) {
    if (!audio) return;
    const t = at || audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    env(g, t, vol, dur);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, ftype, f0, f1 = 0, at = 0) {
    if (!audio) return;
    const t = at || audio.currentTime;
    const src = audio.createBufferSource();
    src.buffer = noiseBuf;
    const fl = audio.createBiquadFilter();
    fl.type = ftype;
    fl.frequency.setValueAtTime(f0, t);
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = audio.createGain();
    env(g, t, vol, dur);
    src.connect(fl).connect(g).connect(master);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.02);
  }
  const PENTA = [0, 2, 4, 7, 9];
  const note = (n) => 392 * Math.pow(2, (PENTA[n % 5] + 12 * Math.floor(n / 5)) / 12);
  const SFX = {
    plop: (p) => { tone(260 * p, 0.09, 'sine', 0.12, 2.4); noise(0.07, 0.06, 'lowpass', 1400); },
    quack: (t = now()) => { tone(640, 0.12, 'square', 0.05, 0.55, t); tone(580, 0.15, 'square', 0.05, 0.5, t + 0.15); },
    honk: () => { tone(250, 0.32, 'sawtooth', 0.07, 0.85); tone(256, 0.32, 'sawtooth', 0.05, 0.85); },
    boing: () => tone(150, 0.4, 'sine', 0.14, 5),
    whoosh: () => { noise(0.7, 0.16, 'bandpass', 300, 6000); tone(180, 0.6, 'sawtooth', 0.03, 5); },
    vroom: () => { tone(55, 0.7, 'sawtooth', 0.1, 3); tone(58, 0.7, 'square', 0.05, 2.8); },
    clang: () => [523, 1370, 2240, 3170].forEach((f, i) => tone(f, 0.8 - i * 0.15, 'sine', 0.09 / (i + 1))),
    squeak: (t = now()) => { tone(1300, 0.08, 'sine', 0.07, 1.6, t); tone(1500, 0.1, 'sine', 0.06, 1.7, t + 0.1); },
    splat: () => { noise(0.4, 0.28, 'lowpass', 2500, 120); tone(170, 0.35, 'sine', 0.16, 0.3); },
    slap: () => { noise(0.12, 0.2, 'bandpass', 1500); tone(320, 0.08, 'triangle', 0.06, 0.6); },
    siren: (t = now()) => { for (let k = 0; k < 6; k++) tone(k % 2 ? 950 : 620, 0.16, 'square', 0.035, 1.25, t + k * 0.16); },
    riser: () => { tone(180, 0.5, 'sawtooth', 0.05, 5); noise(0.5, 0.1, 'highpass', 600, 7000); },
    chime: (t = now()) => [0, 4, 7, 12].forEach((s, i) => tone(784 * Math.pow(2, s / 12), 0.25, 'triangle', 0.05, 1, t + i * 0.06)),
    arp: (c, t = now()) => { for (let k = 0; k < 4; k++) tone(note(c + k * 2 + 5), 0.12, 'square', 0.025, 1, t + k * 0.045); },
    sad: (t = now()) => [392, 370, 349, 311].forEach((f, i) => tone(f, i === 3 ? 0.9 : 0.3, 'sawtooth', 0.06, i === 3 ? 0.92 : 1, t + i * 0.33)),
    whomp: () => { tone(110, 0.25, 'sine', 0.2, 0.4); noise(0.2, 0.12, 'lowpass', 600, 80); },
    meow: (t = now()) => { tone(520, 0.14, 'triangle', 0.07, 1.5, t); tone(780, 0.32, 'triangle', 0.07, 0.6, t + 0.13); },
    woof: (t = now()) => { for (let k = 0; k < 2; k++) { noise(0.09, 0.14, 'bandpass', 700, 0, t + k * 0.18); tone(320, 0.1, 'square', 0.05, 0.5, t + k * 0.18); } },
    fart: () => { tone(80, 0.55, 'sawtooth', 0.11, 0.7); tone(86, 0.55, 'square', 0.05, 0.6); noise(0.45, 0.08, 'lowpass', 300); },
    kiss: () => { noise(0.05, 0.12, 'highpass', 3000); tone(1800, 0.09, 'sine', 0.07, 0.5); },
    ding: () => { tone(1568, 0.5, 'triangle', 0.06); tone(2093, 0.4, 'sine', 0.03); },
    ball: (t = now()) => { for (let k = 0; k < 3; k++) tone(1046, 0.05, 'square', 0.04, 1, t + k * 0.12); noise(0.05, 0.18, 'bandpass', 2500, 0, t + 0.4); },
    shing: () => { noise(0.35, 0.12, 'highpass', 3000, 9000); tone(2600, 0.4, 'sine', 0.04, 1.1); },
    gun: (t = now()) => { for (let k = 0; k < 3; k++) { noise(0.14, 0.3, 'lowpass', 4000, 150, t + k * 0.11); tone(140, 0.08, 'square', 0.06, 0.4, t + k * 0.11); } },
    zap: () => { tone(220, 0.25, 'sawtooth', 0.06, 6); noise(0.2, 0.06, 'bandpass', 2000, 6000); },
  };
  const sfx = (name, ...a) => { if (audio) SFX[name](...a); };
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // A little beat while playing; tempo climbs with the speed tier.
  const BASS = [110, 110, 130.8, 146.8, 164.8, 146.8, 130.8, 98];
  let nextStep = 0, step = 0;
  const kickQ = [];
  function music() {
    if (!audio || muted || state !== 'play') return;
    const lvl = tier(stack.length);
    const stepDur = 60 / Math.min(184, 112 + lvl * 6) / 2;
    if (nextStep < audio.currentTime) nextStep = audio.currentTime + 0.05;
    while (nextStep < audio.currentTime + 0.12) {
      const t = nextStep, s = step % 8;
      if (s === 0 || s === 4 || (lvl >= 4 && s === 7)) { tone(150, 0.16, 'sine', 0.22, 0.28, t); kickQ.push(t); }
      if (s === 2 || s === 6) { noise(0.12, 0.07, 'bandpass', 1800, 0, t); tone(200, 0.07, 'triangle', 0.035, 0.6, t); }
      noise(0.03, s % 2 ? 0.015 : 0.03, 'highpass', 7000, 0, t);
      if (s % 2 === 0) tone(BASS[(step >> 1) % 8], 0.18, 'triangle', 0.07, 1, t);
      if (combo >= 3) tone(note(((step * 3) % 10) + 5), 0.07, 'square', 0.018, 1, t);
      step++;
      nextStep += stepDur;
    }
  }

  // ---------- input: one finger, hold and slide ----------
  let holding = false, holdX = 0, holdCone = 0;
  const muteBtn = () => ({ x: W - 30, y: Math.max(18, H * 0.06) + R * 0.9 });
  cvs.addEventListener('pointerdown', (e) => {
    initAudio();
    if (audio && audio.state === 'suspended') audio.resume();
    const rect = cvs.getBoundingClientRect();
    const mb = muteBtn();
    if (Math.hypot(e.clientX - rect.left - mb.x, e.clientY - rect.top - mb.y) < 26) {
      muted = !muted;
      store('scoops-muted', muted ? '1' : '0');
      if (master) master.gain.value = muted ? 0 : 0.9;
      return;
    }
    if (state === 'title') { state = 'play'; stateT = 0; sfx('chime'); }
    else if (state === 'over') {
      if (stateT < 0.7) return;
      reset();
      state = 'play';
      sfx('chime');
    }
    holding = true;
    holdX = e.clientX;
    holdCone = cone.tx;
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cvs.addEventListener('pointermove', (e) => {
    if (!holding) return;
    // Relative drag, so the finger never has to cover the tower.
    const c = topCx();
    cone.tx = clamp(holdCone + (e.clientX - holdX) * 1.2, R - c, W - R - c);
  });
  const release = () => { holding = false; };
  cvs.addEventListener('pointerup', release);
  cvs.addEventListener('pointercancel', release);
  cvs.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- junk that starts falling at 30 scoops ----------
  function heart(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x - s, y - s * 0.3, x - s * 0.4, y - s, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.4, y - s, x + s, y - s * 0.3, x, y + s * 0.35);
    ctx.fill();
  }
  const JUNK = [
    { label: 'STINKY SHOE!', sfx: 'honk', col: '#ff4d6d', draw(r) {
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, r * 0.3);
      ctx.lineTo(-r * 0.88, -r * 0.4);
      ctx.quadraticCurveTo(-r * 0.6, -r * 0.62, -r * 0.3, -r * 0.5);
      ctx.lineTo(-r * 0.1, -r * 0.18);
      ctx.quadraticCurveTo(r * 0.65, -r * 0.18, r, r * 0.12);
      ctx.lineTo(r, r * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.roundRect(-r, r * 0.22, r * 2, r * 0.32, r * 0.14);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = r * 0.08;
      ctx.lineCap = 'round';
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(-r * 0.55 + k * r * 0.22, -r * 0.35 + k * r * 0.08);
        ctx.lineTo(-r * 0.3 + k * r * 0.22, -r * 0.15 + k * r * 0.08);
        ctx.stroke();
      }
      ctx.strokeStyle = '#6c757d';
      ctx.lineWidth = r * 0.05;
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, -r * 0.75); ctx.quadraticCurveTo(-r * 0.3, -r * 0.95, -r * 0.5, -r * 1.1);
      ctx.moveTo(-r * 0.2, -r * 0.7); ctx.quadraticCurveTo(0, -r * 0.9, -r * 0.2, -r * 1.05);
      ctx.stroke();
    } },
    { label: 'WHOSE BRA?!', sfx: 'boing', col: '#ff8fab', draw(r) {
      ctx.strokeStyle = '#ff5c8a';
      ctx.lineWidth = r * 0.09;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-r * 0.82, -r * 0.08); ctx.lineTo(-r * 0.62, -r * 0.8);
      ctx.moveTo(r * 0.82, -r * 0.08); ctx.lineTo(r * 0.62, -r * 0.8);
      ctx.moveTo(-r * 1.05, -r * 0.02); ctx.lineTo(r * 1.05, -r * 0.02);
      ctx.stroke();
      for (const s of [-1, 1]) {
        ctx.fillStyle = '#ff8fab';
        ctx.beginPath();
        ctx.ellipse(s * r * 0.46, -r * 0.08, r * 0.46, r * 0.5, 0, 0, Math.PI);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        for (let k = 0; k < 3; k++) heart(s * r * 0.46 + (k - 1) * r * 0.2, r * 0.12 + (k % 2) * r * 0.12, r * 0.09);
      }
      ctx.fillStyle = '#ff5c8a';
      ctx.beginPath();
      ctx.arc(0, -r * 0.05, r * 0.1, 0, Math.PI * 2);
      ctx.fill();
    } },
    { label: 'NICE BOXERS', sfx: 'slap', col: '#4cc9f0', draw(r) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(-r * 0.85, -r * 0.4);
      ctx.lineTo(r * 0.85, -r * 0.4);
      ctx.lineTo(r * 0.95, r * 0.6);
      ctx.lineTo(r * 0.12, r * 0.6);
      ctx.lineTo(0, r * 0.12);
      ctx.lineTo(-r * 0.12, r * 0.6);
      ctx.lineTo(-r * 0.95, r * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ff4d6d';
      for (let k = 0; k < 7; k++) heart(-r * 0.6 + (k % 4) * r * 0.4, -r * 0.1 + Math.floor(k / 4) * r * 0.42, r * 0.12);
      ctx.fillStyle = '#4cc9f0';
      ctx.beginPath();
      ctx.roundRect(-r * 0.9, -r * 0.62, r * 1.8, r * 0.26, r * 0.08);
      ctx.fill();
    } },
    { label: 'LIFTOFF!', sfx: 'whoosh', col: '#ff9f1c', draw(r) {
      ctx.fillStyle = Math.random() < 0.5 ? '#ffd166' : '#ff9f1c';
      ctx.beginPath();
      ctx.moveTo(-r * 0.22, r * 0.55);
      ctx.lineTo(0, r * (0.95 + Math.random() * 0.35));
      ctx.lineTo(r * 0.22, r * 0.55);
      ctx.fill();
      ctx.fillStyle = '#e63946';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * r * 0.3, r * 0.05);
        ctx.lineTo(s * r * 0.62, r * 0.65);
        ctx.lineTo(s * r * 0.3, r * 0.55);
        ctx.fill();
      }
      ctx.fillStyle = '#f1f3f5';
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.quadraticCurveTo(r * 0.42, -r * 0.6, r * 0.34, r * 0.6);
      ctx.lineTo(-r * 0.34, r * 0.6);
      ctx.quadraticCurveTo(-r * 0.42, -r * 0.6, 0, -r * 1.05);
      ctx.fill();
      ctx.fillStyle = '#e63946';
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.quadraticCurveTo(r * 0.3, -r * 0.8, r * 0.38, -r * 0.55);
      ctx.lineTo(-r * 0.38, -r * 0.55);
      ctx.quadraticCurveTo(-r * 0.3, -r * 0.8, 0, -r * 1.05);
      ctx.fill();
      ctx.fillStyle = '#adb5bd';
      ctx.beginPath(); ctx.arc(0, -r * 0.15, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4cc9f0';
      ctx.beginPath(); ctx.arc(0, -r * 0.15, r * 0.14, 0, Math.PI * 2); ctx.fill();
    } },
    { label: 'VROOM VROOM', sfx: 'vroom', col: '#7d8597', draw(r) {
      ctx.fillStyle = '#979dac';
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.roundRect(-r * 0.65 + k * r * 0.45, -r * 0.7, r * 0.34, r * 0.55, r * 0.06);
        ctx.fill();
      }
      ctx.fillStyle = '#5c677d';
      ctx.beginPath();
      ctx.roundRect(-r * 0.85, -r * 0.25, r * 1.7, r * 0.85, r * 0.12);
      ctx.fill();
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.roundRect(r * 0.62, -r * 0.55, r * 0.35, r * 0.18, r * 0.05);
      ctx.fill();
      ctx.save();
      ctx.translate(-r * 0.2, r * 0.18);
      ctx.rotate(time * 6);
      ctx.fillStyle = '#ced4da';
      for (let k = 0; k < 8; k++) {
        ctx.rotate(Math.PI / 4);
        ctx.fillRect(-r * 0.06, -r * 0.3, r * 0.12, r * 0.12);
      }
      ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5c677d';
      ctx.beginPath(); ctx.arc(0, 0, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } },

      ctx.fillStyle = '#6f4e37';
      for (const a of [a0, a1]) { ctx.beginPath(); ctx.arc(Math.cos(a) * rr, cy + Math.sin(a) * rr, r * 0.09, 0, Math.PI * 2); ctx.fill(); }
    } },
    { label: 'TP EMERGENCY', sfx: 'whoosh', col: '#e9ecef', draw(r) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(r * 0.25, 0, r * 0.4, r * 0.85);
      ctx.strokeStyle = '#ced4da';
      ctx.lineWidth = r * 0.03;
      ctx.setLineDash([r * 0.06, r * 0.05]);
      ctx.beginPath(); ctx.moveTo(r * 0.25, r * 0.5); ctx.lineTo(r * 0.65, r * 0.5); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(-r * 0.6, -r * 0.5, r * 1.2, r * 0.95);
      ctx.beginPath(); ctx.ellipse(0, r * 0.45, r * 0.6, r * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e9ecef';
      ctx.beginPath(); ctx.ellipse(0, -r * 0.5, r * 0.6, r * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#adb5bd';
      ctx.beginPath(); ctx.ellipse(0, -r * 0.5, r * 0.2, r * 0.07, 0, 0, Math.PI * 2); ctx.fill();
    } },
    { label: 'CONE ZONE', sfx: 'honk', col: '#ff6d00', draw(r) {
      ctx.save();
      ctx.fillStyle = '#ff6d00';
      ctx.beginPath(); ctx.moveTo(-r * 0.6, r * 0.6); ctx.lineTo(-r * 0.12, -r * 0.95); ctx.lineTo(r * 0.12, -r * 0.95); ctx.lineTo(r * 0.6, r * 0.6); ctx.closePath(); ctx.fill();
      ctx.clip();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-r, -r * 0.4, r * 2, r * 0.22);
      ctx.fillRect(-r, r * 0.1, r * 2, r * 0.22);
      ctx.restore();
      ctx.fillStyle = '#e85d04';
      ctx.beginPath(); ctx.roundRect(-r * 0.85, r * 0.55, r * 1.7, r * 0.22, r * 0.06); ctx.fill();
    } },
    { label: 'DONUT!', sfx: 'ding', col: '#ff8fab', draw(r) {
      ctx.fillStyle = '#e9a46a';
      ctx.beginPath(); ctx.ellipse(0, r * 0.1, r * 0.9, r * 0.58, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8fab';
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.8, r * 0.48, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b5713d';
      ctx.beginPath(); ctx.ellipse(0, r * 0.03, r * 0.25, r * 0.14, 0, 0, Math.PI * 2); ctx.fill();
      for (let k = 0; k < 10; k++) {
        const a = k * 0.63, d = k % 2 ? 0.55 : 0.4;
        ctx.save();
        ctx.translate(Math.cos(a) * r * d, Math.sin(a) * r * d * 0.6);
        ctx.rotate(a * 2);
        ctx.fillStyle = SPRINKLES[k % SPRINKLES.length];
        ctx.fillRect(-r * 0.08, -r * 0.03, r * 0.16, r * 0.06);
        ctx.restore();
      }
    } },
  ];

  // Share of drops that are junk: 40% at 30 scoops, 80% at 45, 100% from 60.
  function junkRate(n) {
    if (n < 30) return 0;
    if (n < 45) return 0.4 + 0.4 * (n - 30) / 15;
    if (n < 60) return 0.8 + 0.2 * (n - 45) / 15;
    return 1;
  }

  // ---------- effects ----------
  const addShake = (v) => { if (!reduceMotion) shake = Math.max(shake, v); };
  const flash = (c, a) => { flashC = c; flashA = Math.max(flashA, reduceMotion ? a * 0.4 : a); };
  function burst(x, y, color, n, power) {
    if (bits.length > 700) return;
    for (let k = 0; k < n; k++) {
      const a = rand(0, Math.PI * 2), s = rand(0.3, 1) * power;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - power * 0.4, r: rand(2, 5.5), c: color, life: rand(0.5, 0.9) });
    }
  }
  function confetti(x, y, n) {
    if (bits.length > 700) return;
    for (let k = 0; k < n; k++) {
      const a = rand(-Math.PI, 0), s = rand(250, 650);
      bits.push({ rect: true, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, w: rand(5, 10), h: rand(3, 6), rot: rand(0, 6), vr: rand(-12, 12), c: pick(CONFETTI), life: rand(1, 1.8) });
    }
  }
  const ring = (x, y, c) => rings.push({ x, y, c, t: 0 });
  const SIZES = { s: [0.55, 0.75], m: [0.9, 0.95], l: [1.2, 1.1], xl: [1.65, 1.5] };
  function pop(text, x, y, size, color = '#ff7a00') {
    pops.push({ text, x, y, t: 0, size, color, rot: rand(-0.25, 0.25) });
  }

  // ---------- game ----------
  function spawn() {
    const n = stack.length;
    const speedK = Math.min(0.27 * (1 + tier(n) * 0.12), 1.1);
    const base = { x: rand(R * 1.2, W - R * 1.2), y: -R * 1.5, vy: H * speedK * rand(0.9, 1.1), wob: rand(0, 6), rot: 0, spin: 0, passed: false };
    if (lives < 3 && n > 4 && Math.random() < 0.09) {
      falling.push({ ...base, kind: 'cherry' });
    } else if (Math.random() < junkRate(n)) {
      falling.push({ ...base, kind: 'junk', j: pick(JUNK), spin: rand(-4, 4) });
    } else {
      falling.push({ ...base, kind: 'scoop', f: pick(FLAVORS), spr: Math.random() < 0.3, seed: pick([7, 131, 529]) });
    }
  }

  function catchIt(f, dx) {
    if (f.kind === 'cherry') {
      lives = Math.min(3, lives + 1);
      const y = landY();
      burst(f.x, y, '#e5383b', 24, 300);
      confetti(f.x, y, 20);
      pop('+1 LIFE', f.x, y - R * 1.2, 'l', '#e5383b');
      flash('#ffb3c1', 0.35);
      sfx('chime');
      buzz(30);
      return;
    }
    const junk = f.kind === 'junk';
    const perfect = Math.abs(dx) < R * 0.2;
    combo = perfect ? combo + 1 : 0;
    const prev = topCx();
    stack.push({ cx: prev + (perfect ? 0 : dx * 0.85), kind: f.kind, f: f.f, j: f.j, spr: f.spr, seed: f.seed, tilt: junk ? rand(-0.3, 0.3) : 0, sq: junk ? 0.45 : 0.5 });
    const n = stack.length;
    score += (junk ? 3 : 1) + (perfect ? Math.min(combo - 1, 4) : 0);
    scorePulse = 1;
    const lvl = tier(n);
    const sx = scoopX(n - 1), sy = toScreenY(scoopWorldY(n - 1));
    const col = junk ? f.j.col : f.f.c;
    burst(sx, sy + R * 0.4, col, perfect ? 26 : 12, perfect ? 360 : 200);
    ring(sx, sy + R * 0.3, perfect ? '#ffffff' : col);
    addShake(perfect ? 9 + lvl : 3 + lvl * 0.5);
    cone.leanV += dx * 6 + rand(-50, 50) * (1 + lvl * 0.25);
    sfx('plop', Math.pow(2, Math.min(combo, 12) / 12));
    if (junk) {
      pop(f.j.label, sx, sy - R * 1.7, 'l', f.j.col);
      sfx(f.j.sfx);
      flash('#ffffff', 0.4);
      confetti(sx, sy, 26);
      freeze = 0.08;
      buzz([20, 30, 40]);
    } else if (perfect) {
      const word = COMBO_WORDS[Math.min(combo, COMBO_WORDS.length) - 1];
      pop(combo > COMBO_WORDS.length ? word + ' ×' + combo : word, sx, sy - R * 1.7, combo >= 3 ? 'xl' : 'l', combo >= 3 ? pick(CONFETTI.slice(0, 6)) : '#ff7a00');
      sfx('arp', Math.min(combo, 10));
      flash('#ffffff', combo >= 3 ? 0.45 : 0.25);
      if (combo >= 2) confetti(sx, sy, 10 + combo * 6);
      freeze = 0.05;
      buzz(25);
    } else {
      if (Math.random() < 0.5) pop(pick(SMALL_WORDS), sx + rand(-R, R), sy - R * 1.3, 's');
      buzz(10);
    }
    if (lvl > tier(n - 1)) {
      pop('FASTER!', W / 2, H * 0.34, 'xl', '#ff4d6d');
      sfx('riser');
      flash('#ffd166', 0.3);
      addShake(14);
    }
    const banner = { 30: 'JUNK INCOMING', 45: 'MORE JUNK!!', 60: 'ALL JUNK. NO SCOOPS.' }[n];
    if (banner) {
      pop(banner, W / 2, H * 0.42, 'xl', '#9b5de5');
      sfx('siren');
      flash('#9b5de5', 0.4);
      confetti(W / 2, H * 0.45, 70);
      addShake(18);
    }
  }

  function miss(f) {
    if (f.kind === 'cherry') return;
    // Junk counts like a scoop: from 60 scoops it is all that falls.
    lives--;
    combo = 0;
    addShake(18);
    flash('#ff4d6d', 0.4);
    burst(f.x, H - 6, f.kind === 'junk' ? f.j.col : f.f.c, 36, 420);
    pop('SPLAT!', f.x, H - R * 2.4, 'xl', '#ff4d6d');
    sfx('splat');
    buzz([60, 40, 60]);
    if (lives <= 0) gameOver();
  }

  function gameOver() {
    state = 'over';
    stateT = 0;
    holding = false;
    if (score > best) { best = score; store('scoops-best', String(best)); }
    // The visible part of the tower topples.
    const dir = cone.lean >= 0 ? 1 : -1;
    for (let i = Math.max(0, stack.length - 16); i < stack.length; i++) {
      const y = toScreenY(scoopWorldY(i));
      if (y < -R * 2 || y > H + R * 2) continue;
      const h = (i - (stack.length - 16)) / 16;
      bits.push({ obj: stack[i], x: scoopX(i), y, vx: dir * rand(60, 200) * (0.5 + h) + rand(-90, 90), vy: rand(-380, -80), rot: 0, vr: rand(-7, 7), life: 3 });
    }
    stack = [];
    falling = [];
    addShake(24);
    flash('#ffffff', 0.6);
    sfx('sad');
    buzz([80, 60, 160]);
  }

  function update(dt) {
    time += dt;
    stateT += dt;
    shake *= Math.pow(0.0015, dt);
    flashA = Math.max(0, flashA - dt * 2.6);
    scorePulse = Math.max(0, scorePulse - dt * 4);
    beat = Math.max(0, beat - dt * 6);
    while (kickQ.length && kickQ[0] <= now()) { kickQ.shift(); beat = 1; }
    music();

    // Cone follows the finger with a little smoothing.
    cone.px = cone.x;
    if (state === 'title') cone.tx = W / 2 + Math.sin(stateT * 1.6) * W * 0.18;
    const c = topCx();
    cone.tx = clamp(cone.tx, R - c, W - R - c);
    cone.x += (cone.tx - cone.x) * (1 - Math.exp(-dt * 26));
    const vel = (cone.x - cone.px) / Math.max(dt, 1e-3);
    const target = clamp(-vel * 0.05, -R * 1.3, R * 1.3);
    cone.leanV += ((target - cone.lean) * 110 - cone.leanV * 9) * dt;
    cone.lean += cone.leanV * dt;

    for (const s of stack) if (s.sq < 1) s.sq = Math.min(1, s.sq + (1 - s.sq) * dt * 12 + dt * 0.4);

    // Camera keeps the landing spot around the middle of the screen.
    const want = Math.max(0, scoopWorldY(stack.length) - (BASE - H * 0.52));
    cam += (want - cam) * (1 - Math.exp(-dt * 5));

    if (state === 'play') {
      spawnT -= dt;
      const lvl = tier(stack.length);
      const maxAir = 1 + Math.min(2, Math.floor(lvl / 3));
      if (spawnT <= 0 && falling.length < maxAir) {
        spawn();
        spawnT = Math.max(0.42, 1.45 - lvl * 0.09) * rand(0.85, 1.2);
      }
      for (let k = falling.length - 1; k >= 0; k--) {
        const f = falling[k];
        const ly = landY();
        const before = f.y;
        f.y += f.vy * dt;
        f.wob += dt * 3;
        f.rot += f.spin * dt;
        if (!f.passed && before < ly && f.y >= ly) {
          const dx = f.x - landX();
          if (Math.abs(dx) < (f.kind === 'scoop' ? R * 1.05 : R * 1.2)) {
            catchIt(f, dx);
            falling.splice(k, 1);
            continue;
          }
          f.passed = true;
        }
        if (f.y > H + R * 2) {
          falling.splice(k, 1);
          if (state === 'play') miss(f);
        }
      }
    }

    for (let k = bits.length - 1; k >= 0; k--) {
      const b = bits[k];
      if (b.rect) { b.vx *= Math.pow(0.3, dt); b.vy += 500 * dt; b.vy *= Math.pow(0.5, dt); }
      else b.vy += 900 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.vr) b.rot += b.vr * dt;
      if (b.life <= 0 || b.y > H + R * 3) bits.splice(k, 1);
    }
    for (let k = pops.length - 1; k >= 0; k--) {
      pops[k].t += dt;
      if (pops[k].t > SIZES[pops[k].size][1]) pops.splice(k, 1);
    }
    for (let k = rings.length - 1; k >= 0; k--) {
      rings[k].t += dt;
      if (rings[k].t > 0.45) rings.splice(k, 1);
    }
  }

  // ---------- drawing ----------
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (p, s) => (p >> s) & 255;
    const m = (s) => Math.round(ch(pa, s) + (ch(pb, s) - ch(pa, s)) * t);
    return `rgb(${m(16)},${m(8)},${m(0)})`;
  }

  // Halftone dots painted once at device resolution; a pattern fill every
  // frame is several times slower on phones.
  function makeHalftone() {
    const c = document.createElement('canvas');
    c.width = Math.ceil((W + 80) * DPR);
    c.height = Math.ceil((H + 80) * DPR);
    const g = c.getContext('2d');
    g.scale(DPR, DPR);
    g.fillStyle = 'rgba(0,0,0,0.13)';
    g.beginPath();
    for (let y = 0; y < H + 80; y += 7) {
      for (let x = (y / 7) % 2 ? 7 : 0; x < W + 80; x += 14) {
        g.moveTo(x + 2, y);
        g.arc(x, y, 2, 0, Math.PI * 2);
      }
    }
    g.fill();
    return c;
  }

  function star5(x, y, r, rot = 0) {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = rot - Math.PI / 2 + (k * Math.PI) / 5, d = k % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
    }
    ctx.closePath();
  }

  function sparkle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y);
    ctx.quadraticCurveTo(x, y, x, y - r);
    ctx.fill();
  }

  function sky() {
    const p = (cam / (H * 5)) % SKIES.length;
    const i = Math.floor(p), t = p - i;
    const a = SKIES[i], b = SKIES[(i + 1) % SKIES.length];
    const s = t * t * (3 - 2 * t);
    const g = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.8);
    g.addColorStop(0, mix(a[1], b[1], s));
    g.addColorStop(1, mix(a[0], b[0], s));
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, W + 80, H + 80);
    rays(W / 2, H * 0.42, 18, 'rgba(255,255,255,0.14)', time * 0.12);
    if (halftone) ctx.drawImage(halftone, -40, -40, W + 80, H + 80);
    if (combo >= 3 && state === 'play') {
      ctx.fillStyle = `hsla(${(time * 140) % 360}, 100%, 60%, ${0.18 + beat * 0.08})`;
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }
    if (beat && state === 'play') {
      ctx.fillStyle = `rgba(255,255,255,${beat * 0.1})`;
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }
    // Sparkles drifting past as the camera climbs.
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let k = 0; k < 14; k++) {
      const hx = Math.sin(k * 12.9898) * 43758.5453, hy = Math.sin(k * 78.233) * 12543.123;
      const x = (hx - Math.floor(hx)) * W;
      const span = H + 80;
      const y = (((hy - Math.floor(hy)) * span + cam * (0.25 + (k % 3) * 0.12)) % span) - 40;
      const tw = 0.6 + 0.4 * Math.sin(time * 3 + k);
      sparkle(x, y, (4 + (k % 4) * 2.5) * tw * (1 + beat * 0.4));
    }
  }

  function rays(x, y, n, color, rot) {
    const len = Math.max(W, H) * 1.3;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, len, a, a + Math.PI / n);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Every object is painted once into a sprite with a thick black comic
  // outline and a hard drop shadow, then blitted each frame.
  function sprite(key, paint) {
    let sp = sprites.get(key);
    if (sp) return sp;
    const half = Math.ceil(R * 1.7);
    const px = Math.ceil(half * 2 * DPR);
    const art = document.createElement('canvas');
    art.width = art.height = px;
    const ac = art.getContext('2d');
    ac.setTransform(DPR, 0, 0, DPR, px / 2, px / 2);
    const main = ctx;
    ctx = ac;
    try { paint(); } finally { ctx = main; }
    const line = document.createElement('canvas');
    line.width = line.height = px;
    const lc = line.getContext('2d');
    const o = Math.max(2, R * 0.085) * DPR;
    for (let k = 0; k < 16; k++) {
      const a = (k / 16) * Math.PI * 2;
      lc.drawImage(art, Math.cos(a) * o, Math.sin(a) * o);
    }
    lc.globalCompositeOperation = 'source-in';
    lc.fillStyle = BLACK;
    lc.fillRect(0, 0, px, px);
    const out = document.createElement('canvas');
    out.width = out.height = px;
    const oc = out.getContext('2d');
    oc.globalAlpha = 0.3;
    oc.drawImage(line, o * 0.9, o * 1.3);
    oc.globalAlpha = 1;
    oc.drawImage(line, 0, 0);
    oc.drawImage(art, 0, 0);
    sp = { c: out, half };
    sprites.set(key, sp);
    return sp;
  }

  function blit(sp, x, y, rot = 0, sx = 1, sy = 1) {
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.scale(sx, sy);
    ctx.drawImage(sp.c, -sp.half, -sp.half, sp.half * 2, sp.half * 2);
    ctx.restore();
  }

  function scoopShape(r, s) {
    const f = s.f;
    // Drippy skirt.
    ctx.fillStyle = f.d;
    ctx.beginPath();
    ctx.ellipse(0, r * 0.38, r * 1.0, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.arc(k * r * 0.4, r * 0.62 + (k % 2 ? r * 0.06 : 0), r * 0.24, 0, Math.PI * 2);
      ctx.fill();
    }
    // Body.
    ctx.fillStyle = f.c;
    ctx.beginPath();
    ctx.arc(0, -r * 0.05, r * 0.92, 0, Math.PI * 2);
    ctx.fill();
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.arc(k * r * 0.4, r * 0.48 + (k % 2 ? 0 : r * 0.04), r * 0.27, 0, Math.PI * 2);
      ctx.fill();
    }
    // Sprinkles.
    if (s.spr) {
      for (let k = 0; k < 6; k++) {
        const a = s.seed + k * 2.4;
        const px = Math.cos(a) * r * 0.55, py = Math.sin(a * 1.3) * r * 0.45 - r * 0.15;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a * 3);
        ctx.fillStyle = SPRINKLES[k % SPRINKLES.length];
        ctx.fillRect(-r * 0.11, -r * 0.035, r * 0.22, r * 0.07);
        ctx.restore();
      }
    }
    // Shine.
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.36, -r * 0.42, r * 0.22, r * 0.13, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawItem(x, y, r, o, sq = 1, rot = 0) {
    const key = o.kind === 'junk' ? 'j' + JUNK.indexOf(o.j) : 's' + FLAVORS.indexOf(o.f) + (o.spr ? '-' + o.seed : '');
    const sp = sprite(key, () => (o.kind === 'junk' ? o.j.draw(R) : scoopShape(R, o)));
    blit(sp, x, y, rot + (o.tilt || 0), 2 - sq, sq);
  }

  function cherryShape(r) {
    ctx.strokeStyle = '#3f8f29';
    ctx.lineWidth = Math.max(2, r * 0.1);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.35);
    ctx.quadraticCurveTo(r * 0.1, -r * 0.9, r * 0.45, -r * 1.05);
    ctx.stroke();
    ctx.fillStyle = '#ff1f3d';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(-r * 0.16, -r * 0.14, r * 0.1, 0, Math.PI * 2);
    ctx.fill();
  }
  const drawCherry = (x, y) => blit(sprite('cherry', () => cherryShape(R)), x, y);

  function drawCone(x, rimY) {
    const w = R * 1.0, h = R * 2.7;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - w, rimY);
    ctx.lineTo(x + w, rimY);
    ctx.lineTo(x + R * 0.08, rimY + h);
    ctx.quadraticCurveTo(x, rimY + h + R * 0.08, x - R * 0.08, rimY + h);
    ctx.closePath();
    ctx.fillStyle = '#eab676';
    ctx.fill();
    ctx.clip();
    ctx.strokeStyle = '#cf9450';
    ctx.lineWidth = Math.max(1.5, R * 0.06);
    for (let k = -6; k <= 6; k++) {
      const o = k * R * 0.42;
      ctx.beginPath();
      ctx.moveTo(x + o - h, rimY - 2);
      ctx.lineTo(x + o + h, rimY + h * 2);
      ctx.moveTo(x + o + h, rimY - 2);
      ctx.lineTo(x + o - h, rimY + h * 2);
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = Math.max(2.5, R * 0.1);
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x - w, rimY);
    ctx.lineTo(x + w, rimY);
    ctx.lineTo(x + R * 0.08, rimY + h);
    ctx.quadraticCurveTo(x, rimY + h + R * 0.08, x - R * 0.08, rimY + h);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = '#d99a52';
    const rh = R * 0.34;
    ctx.beginPath();
    ctx.roundRect(x - w * 1.08, rimY - rh * 0.6, w * 2.16, rh, rh / 2);
    ctx.fill();
    ctx.stroke();
  }

  // Arcade lettering: each letter bounces and tilts, with a white face, a
  // black outline, a coloured outer rim and a hard shadow.
  function comic(str, x, y, size, fill = '#ffffff', outer = '#ff7a00', alpha = 1, wob = 0) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `${size}px ${POP}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    const chars = [...str];
    const widths = chars.map((c) => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0);
    const passes = [
      [BLACK, size * 0.42, size * 0.07, size * 0.11],
      [outer, size * 0.42, 0, 0],
      [BLACK, size * 0.2, 0, 0],
      [fill, 0, 0, 0],
    ];
    for (const [color, lw, ox, oy] of passes) {
      let cx = x - total / 2;
      chars.forEach((c, i) => {
        const w = widths[i];
        if (c !== ' ') {
          ctx.save();
          ctx.translate(cx + w / 2 + ox, y + oy + Math.sin(i * 1.9 + wob) * size * 0.07);
          ctx.rotate((i % 2 ? 1 : -1) * 0.07);
          if (lw) { ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeText(c, 0, 0); }
          else { ctx.fillStyle = color; ctx.fillText(c, 0, 0); }
          ctx.restore();
        }
        cx += w;
      });
    }
    ctx.restore();
    return total;
  }

  // A black label tag with white text.
  function pill(str, x, y, size, alpha = 1, bg = BLACK, fg = '#ffffff') {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `800 ${size}px ${BODY}`;
    const w = ctx.measureText(str).width + size * 1.6, h = size * 1.9;
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2);
    ctx.fill();
    ctx.fillStyle = fg;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y + size * 0.05);
    ctx.restore();
  }

  function drawPop(p) {
    const [k, dur] = SIZES[p.size];
    const size = R * k;
    const t = p.t;
    const inT = Math.min(1, t / 0.16);
    const back = 1 + 2.7 * Math.pow(inT - 1, 3) + 1.7 * Math.pow(inT - 1, 2);
    const a = t > dur - 0.25 ? Math.max(0, (dur - t) / 0.25) : 1;
    ctx.font = `${size}px ${POP}`;
    const w = ctx.measureText(p.text).width + size * 0.5;
    const fit = Math.min(1, (W * 0.94) / w);
    const half = (w * fit) / 2;
    const x = clamp(p.x, half, W - half);
    ctx.save();
    ctx.translate(x, p.y - t * 34);
    ctx.rotate(p.rot * (1 - inT * 0.6));
    ctx.scale(back * fit, back * fit);
    if (p.size === 's') comic(p.text, 0, 0, size, '#ffd000', '#ffffff', a);
    else {
      comic(p.text, 0, 0, size, '#ffffff', p.color, a, t * 10);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ffd000';
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 2.5;
      for (const [sx, sy, sr] of [[-w / 2, -size * 0.45, size * 0.32], [w / 2 - size * 0.1, size * 0.35, size * 0.24]]) {
        star5(sx, sy, sr, t * 4);
        ctx.fill();
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawMute() {
    const { x, y } = muteBtn();
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 8, y - 3); ctx.lineTo(x - 4, y - 3); ctx.lineTo(x + 1, y - 8);
    ctx.lineTo(x + 1, y + 8); ctx.lineTo(x - 4, y + 3); ctx.lineTo(x - 8, y + 3);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    if (muted) { ctx.moveTo(x + 4, y - 4); ctx.lineTo(x + 10, y + 4); ctx.moveTo(x + 10, y - 4); ctx.lineTo(x + 4, y + 4); }
    else { ctx.arc(x + 2, y, 5, -0.9, 0.9); ctx.moveTo(x + 5.5, y - 7.5); ctx.arc(x + 2, y, 9, -0.9, 0.9); }
    ctx.stroke();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (shake > 0.3) {
      ctx.translate(W / 2 + rand(-shake, shake), H / 2 + rand(-shake, shake));
      ctx.rotate(rand(-1, 1) * shake * 0.0025);
      ctx.translate(-W / 2, -H / 2);
    }
    sky();
    if (combo >= 3 && state === 'play') rays(landX(), landY(), 14, `rgba(255,240,0,${0.3 + beat * 0.15})`, time * 0.9);

    const rimY = toScreenY(0);
    if (rimY < H + R * 3) drawCone(cone.x, rimY);

    // Only the visible slice of an endless tower is drawn.
    const i0 = Math.max(0, Math.floor((BASE + cam - H - R * 3) / STEP));
    for (let i = i0; i < stack.length; i++) {
      const y = toScreenY(scoopWorldY(i));
      if (y < -R * 2) break;
      drawItem(scoopX(i), y, R, stack[i], stack[i].sq);
    }

    // Guide where the next scoop lands.
    if (state === 'play') {
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.ellipse(landX(), landY() - R * 0.2, R * (1.0 + beat * 0.1), R * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (const r of rings) {
      const k = r.t / 0.45;
      ctx.globalAlpha = 1 - k;
      for (const [c, lw] of [[BLACK, 10], [r.c, 5]]) {
        ctx.strokeStyle = c;
        ctx.lineWidth = lw * (1 - k) + 1;
        ctx.beginPath();
        ctx.ellipse(r.x, r.y, R * (0.9 + k * 3.5), R * (0.35 + k * 1.3), 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    for (const f of falling) {
      const x = f.x + Math.sin(f.wob) * 1.5;
      // Manga speed lines once things get quick.
      if (f.vy > H * 0.33) {
        ctx.strokeStyle = BLACK;
        ctx.lineCap = 'round';
        for (let k = -2; k <= 2; k++) {
          ctx.lineWidth = k % 2 ? 2 : 3.5;
          ctx.beginPath();
          ctx.moveTo(x + k * R * 0.35, f.y - R * 1.15);
          ctx.lineTo(x + k * R * 0.35, f.y - R * 1.15 - f.vy * (0.08 + (k & 1) * 0.05));
          ctx.stroke();
        }
      }
      if (f.kind === 'cherry') drawCherry(x, f.y);
      else drawItem(x, f.y, R, f, 1, f.kind === 'junk' ? f.rot : Math.sin(f.wob) * 0.05);
    }

    ctx.strokeStyle = BLACK;
    ctx.lineJoin = 'round';
    for (const b of bits) {
      if (b.obj) drawItem(b.x, b.y, R, b.obj, 1, b.rot);
      else if (b.rect) {
        ctx.globalAlpha = clamp(b.life / 0.4, 0, 1);
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.fillStyle = b.c;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = clamp(b.life / 0.5, 0, 1);
        ctx.fillStyle = b.c;
        ctx.lineWidth = 1.5;
        star5(b.x, b.y, b.r * 1.6, b.life * 6);
        ctx.fill();
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    for (const p of pops) drawPop(p);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (flashA > 0) {
      ctx.globalAlpha = flashA;
      ctx.fillStyle = flashC;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    const top = Math.max(18, H * 0.06);

    if (state === 'play') {
      const s = 1 + scorePulse * 0.45 + beat * 0.05;
      ctx.save();
      ctx.translate(W / 2, top + R * 0.9);
      ctx.scale(s, s);
      comic(String(score), 0, 0, R * 1.6, '#ffffff', '#ff7a00', 1, time * 2);
      ctx.restore();
      // Lives: three little cones.
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      for (let k = 0; k < 3; k++) {
        const x = W / 2 + (k - 1) * R * 0.75, y = top + R * 2.25;
        ctx.globalAlpha = k < lives ? 1 : 0.3;
        ctx.fillStyle = k < lives ? '#eab676' : BLACK;
        ctx.beginPath();
        ctx.moveTo(x - R * 0.22, y - R * 0.12);
        ctx.lineTo(x + R * 0.22, y - R * 0.12);
        ctx.lineTo(x, y + R * 0.36);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = k < lives ? '#ffffff' : BLACK;
        ctx.beginPath();
        ctx.arc(x, y - R * 0.2, R * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    } else if (state === 'title') {
      const bob = reduceMotion ? 0 : Math.sin(stateT * 2) * 5;
      const size = Math.min(W * 0.16, R * 2.5);
      const ty = H * 0.25 + bob;
      ctx.save();
      ctx.translate(W / 2, ty);
      ctx.rotate(-0.06);
      const w = comic('SCOOPS', 0, 0, size, '#ffffff', '#ff7a00', 1, time * 3);
      ctx.fillStyle = '#ffd000';
      ctx.strokeStyle = BLACK;
      ctx.lineWidth = 3;
      for (const [sx, sy, sr] of [[-w / 2 - size * 0.2, -size * 0.5, size * 0.38], [w / 2 + size * 0.2, size * 0.45, size * 0.3]]) {
        star5(sx, sy, sr, time * 1.5);
        ctx.fill();
        ctx.stroke();
      }
      comic('SPECIAL!!', 0, size * 0.95, size * 0.45, '#ffd000', '#00a8f0', 1, time * 3 + 2);
      ctx.restore();
      pill('HOLD & SLIDE TO CATCH', W / 2, ty + size * 2.0, R * 0.42);
      if (best) pill('BEST ' + best, W / 2, ty + size * 2.0 + R * 1.1, R * 0.36, 1, '#ffffff', BLACK);
    } else if (state === 'over') {
      const a = clamp(stateT * 2.5, 0, 1);
      comic('GAME OVER!!', W / 2, H * 0.22, R * 0.95, '#ffffff', '#00a8f0', a, time * 3);
      comic(String(score), W / 2, H * 0.22 + R * 2.4, R * 2.6, '#ffd000', '#ff2e93', a, time * 2);
      pill(score >= best && score > 0 ? 'NEW BEST!' : 'BEST ' + best, W / 2, H * 0.22 + R * 4.4, R * 0.42, a, '#ffffff', BLACK);
      if (stateT > 0.7) {
        const pulse = reduceMotion ? 1 : 0.75 + Math.sin(stateT * 5) * 0.25;
        pill('TAP TO SCOOP AGAIN', W / 2, H * 0.22 + R * 5.6, R * 0.45, pulse);
      }
    }
    drawMute();
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(1 / 30, (t - last) / 1000);
    last = t;
    // Brief hit-stop on big catches.
    freeze -= dt;
    update(freeze > 0 ? dt * 0.08 : dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`40px ${POP}`).catch(() => {});
    document.fonts.load(`800 20px ${BODY}`).catch(() => {});
  }
})();
</script>
</body>
</html>
