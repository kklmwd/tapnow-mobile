name: Pickleball tracker

# Scrapes Playtomic and Reclub for East / Jalan Kayu pickleball sessions and
# commits the results (SESSIONS.md, sessions.json) to the pickleball-data branch.
on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pickleball-tracker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: Check out the data branch (created on first run)
        run: |
          if git ls-remote --exit-code --heads origin pickleball-data >/dev/null; then
            git fetch --depth 1 origin pickleball-data
            git worktree add data FETCH_HEAD
          else
            git worktree add --detach data
            git -C data checkout --orphan pickleball-data
            git -C data rm -rfq .
          fi

      - name: Scrape
        run: node scrape.mjs --out data --raw

      - name: Show results on the run page
        if: always()
        run: cat data/SESSIONS.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep raw responses for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-responses
          path: data/raw
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit results
        run: |
          cd data
          rm -rf raw
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "Update pickleball sessions" || exit 0
          git push origin HEAD:pickleball-data
